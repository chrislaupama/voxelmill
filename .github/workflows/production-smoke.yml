name: Production smoke

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check custom domain and security policy
        run: |
          curl --fail --silent --show-error --location --max-time 20 https://voxelmill.com/ --output index.html --dump-header headers.txt
          grep --ignore-case '^x-content-type-options: nosniff' headers.txt
          grep --ignore-case '^x-frame-options: DENY' headers.txt
          grep --fixed-strings 'VoxelMill' index.html
      - name: Check PWA metadata
        run: |
          curl --fail --silent --show-error --max-time 20 https://voxelmill.com/manifest.webmanifest --output manifest.webmanifest
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest')); if(m.name!=='VoxelMill') process.exit(1)"
